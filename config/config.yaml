model_list:
  # --------------------------------------------------------------------------
  # 1. Main Failover Group: 'free-coder' (16 Vetted Deployments)
  # Dynamic Multi-Session Load Balancing with Tier Isolation & Least-Busy Distribution
  # --------------------------------------------------------------------------

  # --- TIER 1: Frontier Models (order: 1) ---
  # 1. Mistral Codestral - Premier dedicated code model (256K context, FIM, SOTA coding benchmarks)
  - model_name: free-coder
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY
      order: 1
      rpm: 30
      max_parallel_requests: 2

  # 2. Google Gemini 3.8 Flash - Highest ranking frontier multimodal flash model (1M+ context)
  - model_name: free-coder
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      order: 1
      rpm: 15
      max_parallel_requests: 3

  # 3. Groq GPT-OSS 120B - 120B frontier reasoning model (~200ms on Groq LPU)
  - model_name: free-coder
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      order: 1
      rpm: 30
      max_parallel_requests: 2

  # 4. OpenRouter NVIDIA Nemotron 3 Ultra 550B - SOTA 550B Parameter Ultra Frontier Reasoning (1M Context)
  - model_name: free-coder
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      order: 1
      rpm: 20
      max_parallel_requests: 2
    model_info:
      max_input_tokens: 1000000

  # 5. Cloudflare Workers AI Llama 3.3 70B - Frontier 70B Open-Weights Model (~500ms edge inference)
  - model_name: free-coder
    litellm_params:
      model: openai/@cf/meta/llama-3.3-70b-instruct-fp8-fast
      api_base: https://api.cloudflare.com/client/v4/accounts/d3f4b0ac47a42b21b1b9b9c8b692ceab/ai/v1
      api_key: os.environ/CF_API_TOKEN
      order: 1
      rpm: 100
      max_parallel_requests: 4
    model_info:
      max_output_tokens: 8192
      max_input_tokens: 128000

  # --- TIER 2: Dedicated Coding & Algorithmic Reasoning (order: 2) ---
  # 6. Cohere Command R+ (via OpenAI Compatibility v1) - 128K frontier tool model
  - model_name: free-coder
    litellm_params:
      model: openai/command-r-plus-08-2024
      api_base: https://api.cohere.com/compatibility/v1
      api_key: os.environ/COHERE_API_KEY
      order: 2
      rpm: 20
      max_parallel_requests: 2
    model_info:
      max_output_tokens: 4096
      max_tokens: 4096

  # 7. Groq Qwen 3.8 27B - Top-tier algorithmic coding and math reasoning
  - model_name: free-coder
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY
      order: 2
      rpm: 30
      tpm: 7000
      max_parallel_requests: 1
    model_info:
      max_output_tokens: 16384

  # 8. OpenRouter Cohere North Mini Code - Dedicated SOTA free coding model (65K context)
  - model_name: free-coder
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2
      rpm: 20
      max_parallel_requests: 2
    model_info:
      max_output_tokens: 4096

  # 9. NVIDIA Nemotron 3.5 Lightning - 1M Context Ultra-Fast Reasoning
  - model_name: free-coder
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2
      rpm: 20
      max_parallel_requests: 2
    model_info:
      max_input_tokens: 1000000

  # 10. Gonka Broker - DeepSeek V4 Flash reasoning (400K context, ~170ms)
  - model_name: free-coder
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4-Flash-0731
      api_base: https://proxy.gonkabroker.com/v1
      api_key: os.environ/GONKA_API_KEY
      order: 2
      rpm: 30
      max_parallel_requests: 2

  # --- TIER 3: Resilient High-Availability Fallbacks (order: 3) ---
  # 11. Google Gemini 3.5 Flash - Secondary frontier fallback (1M context)
  - model_name: free-coder
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      order: 3
      rpm: 15
      max_parallel_requests: 3

  # 12. Google Gemini 3.5 Flash-Lite - High-availability tertiary fallback
  - model_name: free-coder
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      order: 3
      rpm: 30
      max_parallel_requests: 3

  # 13. Kilo Code Auto Router - Free coding router (Reflection Beam & free coder models)
  - model_name: free-coder
    litellm_params:
      model: openai/kilo-auto/free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_API_KEY
      order: 3
      rpm: 20
      max_parallel_requests: 2

  # 14. Aion Labs - 128K context reasoning
  - model_name: free-coder
    litellm_params:
      model: openai/aion-labs/aion-2.0
      api_base: https://api.aionlabs.ai/v1
      api_key: os.environ/AION_API_KEY
      order: 3
      rpm: 20
      max_parallel_requests: 2

  # 15. Zhipu AI (Z AI) - GLM-4.7-Flash reasoning
  - model_name: free-coder
    litellm_params:
      model: openai/glm-4.7-flash
      api_base: https://open.bigmodel.cn/api/paas/v4
      api_key: os.environ/ZAI_API_KEY
      order: 3
      rpm: 30
      max_parallel_requests: 2

  # 16. Requesty - Pennytree free reasoning model
  - model_name: free-coder
    litellm_params:
      model: openai/policy/pennytree-free
      api_base: https://router.requesty.ai/v1
      api_key: os.environ/REQUESTY_API_KEY
      order: 3
      rpm: 20
      max_parallel_requests: 2

  # --------------------------------------------------------------------------
  # 2. Direct Target Deployments (Exposed for manual selection in OpenCode TUI)
  # --------------------------------------------------------------------------
  - model_name: mistral/codestral-latest
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: gemini/gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: groq/openai/gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: groq/qwen/qwen3.8-27b
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY

  - model_name: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter/cohere/north-mini-code:free
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      max_output_tokens: 4096

router_settings:
  routing_strategy: least-busy
  allowed_fails: 1
  cooldown_time: 120
  num_retries: 5
  timeout: 60
  fallback_on_unsupported_params: true
  model_group_alias:
    "auto-free/free-coder": "free-coder"
    "gemini-3.8-flash": "free-coder"
    "gemini-3.5-flash-lite": "free-coder"
    "gemini-flash": "free-coder"
    "gemini-pro": "free-coder"
    "gpt": "free-coder"
    "claude-sonnet-4-6": "free-coder"
  fallbacks:
    - free-coder:
        - "mistral/codestral-latest"
        - "gemini/gemini-3.8-flash"
        - "groq/openai/gpt-oss-120b"
        - "openai/@cf/meta/llama-3.3-70b-instruct-fp8-fast"
  retry_policy:
    BadRequestErrorRetries: 3
    TimeoutErrorRetries: 3
    RateLimitErrorRetries: 3
    InternalServerErrorRetries: 3
    ServiceUnavailableErrorRetries: 3
    NotFoundErrorRetries: 3
    ContextWindowExceededErrorRetries: 3
    DefaultRetries: 3

litellm_settings:
  callbacks: ["clean_request.sanitizer"]
  drop_params: true
  model_alias:
    "auto-free/free-coder": "free-coder"
    "gemini-3.8-flash": "free-coder"
    "gemini-3.5-flash-lite": "free-coder"
    "gemini-flash": "free-coder"
    "gemini-pro": "free-coder"
    "gpt": "free-coder"
    "claude-sonnet-4-6": "free-coder"

general_settings:
  dangerously_permit_weak_or_unset_master_key: true
