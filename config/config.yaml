model_list:
  # --------------------------------------------------------------------------
  # 1. Main Failover Group: 'free-coder' (16 Vetted Deployments)
  # Dynamic Multi-Session Load Balancing with Tier Isolation & Least-Busy Distribution
  # --------------------------------------------------------------------------

  # --- TIER 1: Frontier Models (order: 1) ---
  # 1. Mistral Codestral - Premier dedicated code model (256K context, FIM, SOTA coding benchmarks)
  - model_name: free-coder
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY
      order: 1
      rpm: 30
      max_parallel_requests: 2

  # 2. Google Gemini 3.8 Flash - Highest ranking frontier multimodal flash model (1M+ context)
  - model_name: free-coder
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      order: 1
      rpm: 15
      max_parallel_requests: 3

  # 3. Groq GPT-OSS 120B - 120B frontier reasoning model (~200ms on Groq LPU)
  - model_name: free-coder
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      order: 1
      rpm: 30
      max_parallel_requests: 2

  # 4. OpenRouter NVIDIA Nemotron 3 Ultra 550B - SOTA 550B Parameter Ultra Frontier Reasoning (1M Context)
  - model_name: free-coder
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      order: 1
      rpm: 20
      max_parallel_requests: 2
    model_info:
      max_input_tokens: 1000000

  # 5. Cloudflare Workers AI Llama 3.3 70B - Frontier 70B Open-Weights Model (~500ms edge inference)
  # --- TIER 2: Dedicated Coding & Algorithmic Reasoning (order: 2) ---
  # 6. Cohere Command R+ (via OpenAI Compatibility v1) - 128K frontier tool model
  # 7. Groq Qwen 3.8 27B - Top-tier algorithmic coding and math reasoning
  # 8. OpenRouter Cohere North Mini Code - Dedicated SOTA free coding model (65K context)
  # 9. NVIDIA Nemotron 3.5 Lightning - 1M Context Ultra-Fast Reasoning
  # 10. Gonka Broker - DeepSeek V4 Flash reasoning (400K context, ~170ms)
  - model_name: free-coder
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4-Flash-0731
      api_base: https://proxy.gonkabroker.com/v1
      api_key: os.environ/GONKA_API_KEY
      order: 2
      rpm: 30
      max_parallel_requests: 2

  # --- Re-added after live tool-call probe (2026-11-06): all returned tool_calls ---
  # NVIDIA NIM direct Nemotron 3 Ultra 550B - 40 RPM / 10K RPD, biggest free quota
  - model_name: free-coder
    litellm_params:
      model: openai/nvidia/nemotron-3-ultra-550b-a55b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      order: 1
      rpm: 40
      max_parallel_requests: 3
    model_info:
      max_input_tokens: 1000000

  # Kilo Nemotron 3 Ultra 550B (separate 200 req/hr quota, same model)
  - model_name: free-coder
    litellm_params:
      model: openai/nvidia/nemotron-3-ultra-550b-a55b:free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_API_KEY
      order: 1
      rpm: 40
      max_parallel_requests: 2
    model_info:
      max_input_tokens: 1000000

  # Gemini 3.6 Flash - sibling of 3.8 (which 503s under load)
  - model_name: free-coder
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      order: 1
      rpm: 15
      max_parallel_requests: 3

  # Tier 2 additions
  - model_name: free-coder
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY
      order: 2
      rpm: 30
      max_parallel_requests: 1
    model_info:
      max_output_tokens: 16384

  - model_name: free-coder
    litellm_params:
      model: openai/cohere/north-mini-code:free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_API_KEY
      order: 2
      rpm: 40
      max_parallel_requests: 2
    model_info:
      max_output_tokens: 8192

  - model_name: free-coder
    litellm_params:
      model: openai/reflection/beam-free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_API_KEY
      order: 2
      rpm: 40
      max_parallel_requests: 2
    model_info:
      max_input_tokens: 1000000

  - model_name: free-coder
    litellm_params:
      model: openai/MiniMaxAI/MiniMax-M2.7
      api_base: https://proxy.gonkabroker.com/v1
      api_key: os.environ/GONKA_API_KEY
      order: 2
      rpm: 6
      max_parallel_requests: 1

  - model_name: free-coder
    litellm_params:
      model: openai/command-a-plus-05-2026
      api_base: https://api.cohere.com/compatibility/v1
      api_key: os.environ/COHERE_API_KEY
      order: 2
      rpm: 20
      max_parallel_requests: 2
    model_info:
      max_output_tokens: 8192

  - model_name: free-coder
    litellm_params:
      model: openai/@cf/openai/gpt-oss-120b
      api_base: https://api.cloudflare.com/client/v4/accounts/d3f4b0ac47a42b21b1b9b9c8b692ceab/ai/v1
      api_key: os.environ/CF_API_KEY
      order: 2
      rpm: 60
      max_parallel_requests: 2


  # Tier 2: Mistral/Gonka/Groq (429s seen in probe were daily/minute quota, models are fine)
  - model_name: free-coder
    litellm_params:
      model: mistral/mistral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY
      order: 2
      rpm: 30
      max_parallel_requests: 2

  - model_name: free-coder
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY
      order: 2
      rpm: 30
      max_parallel_requests: 2

  - model_name: free-coder
    litellm_params:
      model: openai/zai-org/GLM-5.3-Flash
      api_base: https://proxy.gonkabroker.com/v1
      api_key: os.environ/GONKA_API_KEY
      order: 2
      rpm: 6
      max_parallel_requests: 1

  - model_name: free-coder
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      order: 2
      rpm: 30
      max_parallel_requests: 2

  # Requesty free models (org limit: low concurrency -> max_parallel_requests 1 each)
  - model_name: free-coder
    litellm_params:
      model: openai/nvidia/nemotron-3-ultra-550b-a55b
      api_base: https://router.requesty.ai/v1
      api_key: os.environ/REQUESTY_API_KEY
      order: 2
      rpm: 20
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 1000000

  - model_name: free-coder
    litellm_params:
      model: openai/nvidia/nemotron-3.5-lightning-30b-a3b
      api_base: https://router.requesty.ai/v1
      api_key: os.environ/REQUESTY_API_KEY
      order: 2
      rpm: 20
      max_parallel_requests: 1
    model_info:
      max_input_tokens: 1000000


  # --- TIER 3: Resilient High-Availability Fallbacks (order: 3) ---
  # 11. Google Gemini 3.5 Flash - Secondary frontier fallback (1M context)
  - model_name: free-coder
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      order: 3
      rpm: 15
      max_parallel_requests: 3

  # 12. Google Gemini 3.5 Flash-Lite - High-availability tertiary fallback
  # 13. Kilo Code Auto Router - Free coding router (Reflection Beam & free coder models)
  # 14. Aion Labs - 128K context reasoning
  # 15. Zhipu AI (Z AI) - GLM-4.7-Flash reasoning
  # 16. Requesty - Pennytree free reasoning model
  # Cloudflare Workers AI Llama 3.3 70B - last-resort tier 3 fallback only
  - model_name: free-coder
    litellm_params:
      model: openai/@cf/meta/llama-3.3-70b-instruct-fp8-fast
      api_base: https://api.cloudflare.com/client/v4/accounts/d3f4b0ac47a42b21b1b9b9c8b692ceab/ai/v1
      api_key: os.environ/CF_API_KEY
      order: 3
      rpm: 100
      max_parallel_requests: 4
    model_info:
      max_output_tokens: 8192
      max_input_tokens: 128000

  # Tier 3 additions
  - model_name: free-coder
    litellm_params:
      model: openai/glm-4.7-flash
      api_base: https://open.bigmodel.cn/api/paas/v4
      api_key: os.environ/ZAI_API_KEY
      order: 3
      rpm: 30
      max_parallel_requests: 1

  - model_name: free-coder
    litellm_params:
      model: openai/command-a-03-2025
      api_base: https://api.cohere.com/compatibility/v1
      api_key: os.environ/COHERE_API_KEY
      order: 3
      rpm: 20
      max_parallel_requests: 2
    model_info:
      max_output_tokens: 8192

  - model_name: free-coder
    litellm_params:
      model: openai/kilo-auto/free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_API_KEY
      order: 3
      rpm: 40
      max_parallel_requests: 2

  - model_name: free-coder
    litellm_params:
      model: openai/@cf/meta/llama-4-scout-17b-16e-instruct
      api_base: https://api.cloudflare.com/client/v4/accounts/d3f4b0ac47a42b21b1b9b9c8b692ceab/ai/v1
      api_key: os.environ/CF_API_KEY
      order: 3
      rpm: 60
      max_parallel_requests: 2

  # Tier 3: slower or smaller
  - model_name: free-coder
    litellm_params:
      model: openai/google/gemma-4-31b-it
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
