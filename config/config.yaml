  - model_name: openrouter/cohere/north-mini-code:free
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      max_output_tokens: 4096

router_settings:
  routing_strategy: least-busy
  allowed_fails: 1
  cooldown_time: 120
  num_retries: 5
  timeout: 60
  fallback_on_unsupported_params: true
  model_group_alias:
    "auto-free/free-coder": "free-coder"
    "gemini-3.8-flash": "free-coder"
    "gemini-3.5-flash-lite": "free-coder"
    "gemini-flash": "free-coder"
    "gemini-pro": "free-coder"
    "gpt": "free-coder"
    "claude-sonnet-4-6": "free-coder"
  fallbacks:
    - free-coder:
        - "mistral/codestral-latest"
        - "gemini/gemini-3.8-flash"
        - "groq/openai/gpt-oss-120b"
  retry_policy:
    BadRequestErrorRetries: 3
    TimeoutErrorRetries: 3
    RateLimitErrorRetries: 3
    InternalServerErrorRetries: 3
    ServiceUnavailableErrorRetries: 3
    NotFoundErrorRetries: 3
    ContextWindowExceededErrorRetries: 3
    DefaultRetries: 3

litellm_settings:
  callbacks: ["clean_request.sanitizer"]
  drop_params: true
  model_alias:
    "auto-free/free-coder": "free-coder"
    "gemini-3.8-flash": "free-coder"
    "gemini-3.5-flash-lite": "free-coder"
    "gemini-flash": "free-coder"
    "gemini-pro": "free-coder"
    "gpt": "free-coder"
    "claude-sonnet-4-6": "free-coder"

general_settings:
  dangerously_permit_weak_or_unset_master_key: true
